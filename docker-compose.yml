# ─── PhiloMind Dev Stack ─────────────────────────────────────
# Usage:  docker compose up -d
# Logs:   docker compose logs -f api
# Reset:  docker compose down -v
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: philo-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-philo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-philo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-philo_mind}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-philo} -d ${POSTGRES_DB:-philo_mind}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - philo-net

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: philo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - philo-net

  # ── API Server (dev mode with hot-reload) ──────────────────
  api:
    build:
      context: ./services
      dockerfile: Dockerfile.dev
    container_name: philo-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-philo}:${POSTGRES_PASSWORD:-philo_secret}@postgres:5432/${POSTGRES_DB:-philo_mind}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me_in_production_32chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ./services/src:/app/src:ro
      - ./services/prisma.config.ts:/app/prisma.config.ts:ro
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - philo-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  philo-net:
    driver: bridge
