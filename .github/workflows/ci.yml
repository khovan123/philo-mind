name: CI/CD

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.check.outputs.services }}
      webapp:   ${{ steps.check.outputs.webapp }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "services=true" >> "$GITHUB_OUTPUT"
            echo "webapp=true"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || echo "")

          # Shared deps → everything is affected
          SHARED="false"
          if echo "$CHANGED" | grep -qE "^(libs/|package\.json$|package-lock\.json$|tsconfig\.base\.json$)"; then
            SHARED="true"
          fi

          # Services (monolith)
          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -q "^services/"; then
            echo "services=true" >> "$GITHUB_OUTPUT"
          else
            echo "services=false" >> "$GITHUB_OUTPUT"
          fi

          # Webapp
          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -q "^webapp/"; then
            echo "webapp=true" >> "$GITHUB_OUTPUT"
          else
            echo "webapp=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Lint & Type-check: services ────────────────────────────────────
  services:
    name: Services Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.services == 'true'

    steps:
      - uses: actions/checkout@v4

