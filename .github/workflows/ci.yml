name: CI/CD

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

env:
  AZURE_REGISTRY: ${{ secrets.AZURE_REGISTRY_URL }}

# ────────────────────────────────────────────────────────────────────────────────
# Stage 1: Detect which services/webapp have code changes.
# Outputs a dynamic JSON matrix so downstream jobs only run for changed targets.
# ────────────────────────────────────────────────────────────────────────────────
jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.check.outputs.services }}
      webapp:   ${{ steps.check.outputs.webapp }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: check
        run: |
          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' }}"
          WEBAPP="${{ steps.filter.outputs.webapp }}"

          if [[ "$FORCE" == "true" || "$WEBAPP" == "true" || "$SHARED" == "true" ]]; then
            echo "has_webapp_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_webapp_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dynamic matrix
        id: set-matrix
        run: |
          SERVICES=()
          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' }}"

          for SVC in api-gateway auth-service user-service notification-service \
                     content-service upload-service billing-service \
                     content-access-service interaction-service \
                     recommendation-service rag-service; do
            # dorny/paths-filter outputs are named exactly as the filter keys,
            # but GHA expressions can't do dynamic property access.
            # Parse from the full outputs JSON instead.
            CHANGED=$(echo '${{ toJson(steps.filter.outputs) }}' | jq -r --arg key "$SVC" '.[$key]')

            if [[ "$FORCE" == "true" || "$CHANGED" == "true" || "$SHARED" == "true" ]]; then
              SERVICES+=("\"$SVC\"")
            fi
          done

          if [[ ${#SERVICES[@]} -gt 0 ]]; then
            MATRIX="{\"service\":[$(IFS=,; echo "${SERVICES[*]}")]}"
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "services=false" >> "$GITHUB_OUTPUT"
          fi

          # Webapp
          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -q "^webapp/"; then
            echo "webapp=true" >> "$GITHUB_OUTPUT"
          else
            echo "webapp=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Stage 2: Lint & Test (backend services only) ───────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_service_changes == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
          RABBITMQ_DEFAULT_VHOST: microservices
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client
        working-directory: services
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.base.json

      - name: Unit tests
        run: npx turbo run test:unit --filter='!webapp' -- --passWithNoTests
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          RABBITMQ_URL: amqp://admin:admin123@localhost:5672/microservices
          JWT_ACCESS_SECRET: test-secret-32-chars-minimum-here
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-here

  # ─── Stage 2b: Webapp lint & type-check (deploy handled by Vercel) ──
  webapp:
    name: Webapp Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.webapp == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Type check webapp
        working-directory: webapp
        run: npx tsc --noEmit
