name: CI/CD

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

# ────────────────────────────────────────────────────────────────────────────────
# Stage 1: Detect which services/webapp have code changes.
# Uses native git diff instead of third-party actions for reliability.
# ────────────────────────────────────────────────────────────────────────────────
jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_service_changes: ${{ steps.set-matrix.outputs.has_service_changes }}
      has_webapp_changes:  ${{ steps.detect-paths.outputs.webapp }}
      services_matrix:     ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect-paths
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "libs=true" >> "$GITHUB_OUTPUT"
            echo "webapp=true" >> "$GITHUB_OUTPUT"
            for SVC in api-gateway auth-service user-service notification-service \
                       content-service upload-service billing-service \
                       content-access-service interaction-service \
                       recommendation-service rag-service; do
              echo "${SVC}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          # Determine diff base
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || echo "")

          # Helper: check if any changed file matches a prefix
          has_changes() {
            echo "$CHANGED" | grep -q "^$1" && echo "true" || echo "false"
          }

          LIBS=$(has_changes "libs/")
          LOCKFILE=$(echo "$CHANGED" | grep -q "^package-lock.json$" && echo "true" || echo "false")
          ROOTPKG=$(echo "$CHANGED" | grep -q "^package.json$" && echo "true" || echo "false")

          # Shared deps changed → everything is affected
          if [[ "$LIBS" == "true" || "$LOCKFILE" == "true" || "$ROOTPKG" == "true" ]]; then
            SHARED="true"
          else
            SHARED="false"
          fi
          echo "shared=$SHARED" >> "$GITHUB_OUTPUT"

          # Webapp
          WEBAPP=$(has_changes "webapp/")
          if [[ "$WEBAPP" == "true" || "$SHARED" == "true" ]]; then
            echo "webapp=true" >> "$GITHUB_OUTPUT"
          else
            echo "webapp=false" >> "$GITHUB_OUTPUT"
          fi

          # Per-service detection
          for SVC in api-gateway auth-service user-service notification-service \
                     content-service upload-service billing-service \
                     content-access-service interaction-service \
                     recommendation-service rag-service; do
            SVC_CHANGED=$(has_changes "services/$SVC/")
            if [[ "$SVC_CHANGED" == "true" || "$SHARED" == "true" ]]; then
              echo "${SVC}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${SVC}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build dynamic matrix
        id: set-matrix
        run: |
          SERVICES=()

          for SVC in api-gateway auth-service user-service notification-service \
                     content-service upload-service billing-service \
                     content-access-service interaction-service \
                     recommendation-service rag-service; do
            # Read from previous step outputs
            VAL=$(echo '${{ toJson(steps.detect-paths.outputs) }}' | jq -r --arg key "$SVC" '.[$key]')
            if [[ "$VAL" == "true" ]]; then
              SERVICES+=("\"$SVC\"")
            fi
          done

          if [[ ${#SERVICES[@]} -gt 0 ]]; then
            MATRIX="{\"service\":[$(IFS=,; echo "${SERVICES[*]}")]}"
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
          else
            MATRIX='{"service":[]}'
            echo "has_service_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "### Changed services matrix" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 2: Lint & Type-check (backend services) ─────────────────
  services:
    name: Services Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_service_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.base.json

  # ─── Stage 2b: Webapp lint & type-check ─────────────────────────────
  webapp:
    name: Webapp Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_webapp_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Type check webapp
        working-directory: webapp
        run: npx tsc --noEmit
