name: CI/CD

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

# ────────────────────────────────────────────────────────────────────────────────
# Stage 1: Detect which services/webapp have code changes.
# Outputs a dynamic JSON matrix so downstream jobs only run for changed targets.
# ────────────────────────────────────────────────────────────────────────────────
jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_service_changes: ${{ steps.set-matrix.outputs.has_service_changes }}
      has_webapp_changes:  ${{ steps.set-webapp.outputs.has_webapp_changes }}
      services_matrix:    ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            libs:
              - 'libs/**'
            lockfile:
              - 'package-lock.json'
            rootpkg:
              - 'package.json'
            webapp:
              - 'webapp/**'
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            user-service:
              - 'services/user-service/**'
            notification-service:
              - 'services/notification-service/**'
            content-service:
              - 'services/content-service/**'
            upload-service:
              - 'services/upload-service/**'
            billing-service:
              - 'services/billing-service/**'
            content-access-service:
              - 'services/content-access-service/**'
            interaction-service:
              - 'services/interaction-service/**'
            recommendation-service:
              - 'services/recommendation-service/**'
            rag-service:
              - 'services/rag-service/**'

      - name: Detect webapp changes
        id: set-webapp
        run: |
          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' }}"
          WEBAPP="${{ steps.filter.outputs.webapp }}"

          if [[ "$FORCE" == "true" || "$WEBAPP" == "true" || "$SHARED" == "true" ]]; then
            echo "has_webapp_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_webapp_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dynamic matrix
        id: set-matrix
        run: |
          SERVICES=()
          SHARED="${{ steps.filter.outputs.libs == 'true' || steps.filter.outputs.lockfile == 'true' || steps.filter.outputs.rootpkg == 'true' }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' }}"

          for SVC in api-gateway auth-service user-service notification-service \
                     content-service upload-service billing-service \
                     content-access-service interaction-service \
                     recommendation-service rag-service; do
            CHANGED=$(echo '${{ toJson(steps.filter.outputs) }}' | jq -r --arg key "$SVC" '.[$key]')

            if [[ "$FORCE" == "true" || "$CHANGED" == "true" || "$SHARED" == "true" ]]; then
              SERVICES+=("\"$SVC\"")
            fi
          done

          if [[ ${#SERVICES[@]} -gt 0 ]]; then
            MATRIX="{\"service\":[$(IFS=,; echo "${SERVICES[*]}")]}"
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
          else
            MATRIX='{"service":[]}'
            echo "has_service_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "### Changed services matrix" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$MATRIX" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 2: Lint & Type-check (backend services) ─────────────────
  services:
    name: Services Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_service_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.base.json

  # ─── Stage 2b: Webapp lint & type-check ─────────────────────────────
  webapp:
    name: Webapp Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_webapp_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Type check webapp
        working-directory: webapp
        run: npx tsc --noEmit
