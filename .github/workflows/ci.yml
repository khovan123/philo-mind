name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.check.outputs.services }}
      webapp:   ${{ steps.check.outputs.webapp }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "services=true" >> "$GITHUB_OUTPUT"
            echo "webapp=true"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || echo "")

          # Shared deps → everything is affected
          SHARED="false"
          if echo "$CHANGED" | grep -qE "^(libs/|package\.json$|package-lock\.json$|tsconfig\.base\.json$)"; then
            SHARED="true"
          fi

          # Services
          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -q "^services/"; then
            echo "services=true" >> "$GITHUB_OUTPUT"
          else
            echo "services=false" >> "$GITHUB_OUTPUT"
          fi

          # Webapp
          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -q "^webapp/"; then
            echo "webapp=true" >> "$GITHUB_OUTPUT"
          else
            echo "webapp=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Services: lint + typecheck + test ───────────────────────────────
  services:
    name: Services CI
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.services == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint -w services

      - name: Format check
        run: npm run format:check -w services

      - name: Generate Prisma Client
        working-directory: services
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npx prisma generate --schema=src/prisma/schema.prisma

      - name: Type check
        working-directory: services
        run: npx tsc --noEmit

      - name: Test
        working-directory: services
        run: npm test

  # ─── Webapp: lint + typecheck ────────────────────────────────────────
  webapp:
    name: Webapp CI
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.webapp == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Validate EAS config
        working-directory: webapp
        run: npm run eas:validate

      - name: Type check webapp
        working-directory: webapp
        run: npx tsc --noEmit

  # ─── Required gate: all jobs must pass ───────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [services, webapp]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Services: ${{ needs.services.result }}"
          echo "Webapp:   ${{ needs.webapp.result }}"

          for result in \
            "${{ needs.services.result }}" \
            "${{ needs.webapp.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ CI failed"
              exit 1
            fi
          done

          echo "✅ All CI checks passed"
