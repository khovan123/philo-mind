name: E2E Smoke Tests (Maestro)

# T-J05 / GitHub issue #123
#
# This workflow runs the Maestro E2E smoke tests on an Android emulator.
# It is triggered manually (workflow_dispatch) or on pull requests to main/production
# that change webapp source files.
#
# Blocker note: Maestro E2E tests require a running app on a device/simulator.
# In CI, this is achieved by:
#   1. Starting an Android emulator via `reactivecircus/android-emulator-runner`.
#   2. Building the Expo app in development mode (expo run:android).
#   3. Running `maestro test` against the launched app.
#
# If the dependency T-D16 (Story screen) is not yet merged, this workflow will
# still validate the login + home navigation path (phases 1 and 2 of the suite).

on:
  workflow_dispatch:
    inputs:
      flow:
        description: "Maestro flow to run (default: full suite)"
        required: false
        default: ".maestro/smoke_login_story_complete.yaml"

  pull_request:
    branches: [main, production]
    paths:
      - "webapp/src/**"
      - "webapp/.maestro/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Smoke (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Java (needed by Android build tools) ──────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Install Maestro CLI ───────────────────────────────────────────────────
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
        # Adds ~/.maestro/bin to PATH for subsequent steps
      - run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # ── Android emulator (API 33, x86_64) ────────────────────────────────────
      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Build & install the Expo app, then run Maestro tests
          script: |
            cd webapp/android

            ./gradlew assembleRelease

            echo "=== APK FILES ==="
            find app/build/outputs -name "*.apk"

            adb install -r app/build/outputs/apk/release/app-release.apk

            cd ..

            maestro test \
              --env MAESTRO_TEST_EMAIL=test@philomind.com \
              --env MAESTRO_TEST_PASSWORD=Test@123456 \
              .maestro/smoke_login_story_complete.yaml \
              --format junit \
              --output test-results/maestro.xml

      # ── Upload results ────────────────────────────────────────────────────────
      - name: Upload Maestro test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            webapp/test-results/
            ~/.maestro/tests/

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "webapp/test-results/maestro.xml"
          check_name: "Maestro E2E Results"

  # ─── Required gate ──────────────────────────────────────────────────────────
  e2e-gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    needs: [e2e-android]
    if: always()
    steps:
      - name: Check E2E result
        run: |
          echo "E2E Android: ${{ needs.e2e-android.result }}"
          if [[ "${{ needs.e2e-android.result }}" == "failure" ]]; then
            echo "❌ E2E smoke tests failed"
            exit 1
          fi
          echo "✅ E2E smoke tests passed"
