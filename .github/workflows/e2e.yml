name: E2E Smoke Tests (Maestro)

# T-J05 / GitHub issue #123
#
# Runs Maestro E2E smoke tests on an Android emulator.
# android/ is gitignored so expo prebuild generates it in CI.

on:
  workflow_dispatch:
    inputs:
      flow:
        description: "Maestro flow to run (default: full suite)"
        required: false
        default: ".maestro/smoke_login_story_complete.yaml"

  pull_request:
    branches: [main, production]
    paths:
      - "webapp/src/**"
      - "webapp/.maestro/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Smoke (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ── Cấp đủ quyền ghi báo cáo JUnit lên Giao diện PR ──────────────────────────
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Java (needed by Gradle) ───────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Install Maestro CLI ───────────────────────────────────────────────────
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # ── KVM hardware acceleration ─────────────────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Generate android/ via expo prebuild ───────────────────────────────────
      - name: Expo Prebuild
        working-directory: webapp
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --non-interactive 2>&1

      - name: Verify gradlew exists
        run: |
          if [ ! -f webapp/android/gradlew ]; then
            echo "ERROR: gradlew not found after prebuild"
            ls -la webapp/android/ || echo "android/ dir missing"
            exit 1
          fi
          chmod +x webapp/android/gradlew
          echo "gradlew OK"

      # ── Cache Gradle ──────────────────────────────────────────────────────────
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('webapp/android/**/*.gradle*', 'webapp/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── Build debug APK ───────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: webapp/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: Verify APK exists
        run: |
          APK="webapp/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            find webapp/android/app/build -name "*.apk" 2>/dev/null || echo "No APKs found"
            exit 1
          fi
          echo "APK OK: $APK"

      # ── Run on emulator + Maestro ─────────────────────────────────────────────
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/webapp/android/app/build/outputs/apk/debug/app-debug.apk"
            mkdir -p "$GITHUB_WORKSPACE/webapp/test-results"
            sleep 5
            cd "$GITHUB_WORKSPACE/webapp" && maestro test --env MAESTRO_TEST_EMAIL=test@philomind.com --env MAESTRO_TEST_PASSWORD=Test@123456 --format junit --output "$GITHUB_WORKSPACE/webapp/test-results/maestro.xml" ".maestro/smoke_login_story_complete.yaml"

      # ── Upload results ────────────────────────────────────────────────────────
      - name: Upload Maestro test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            webapp/test-results/
            ~/.maestro/tests/

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "webapp/test-results/maestro.xml"
          check_name: "Maestro E2E Results"

  # ─── Required gate ──────────────────────────────────────────────────────────
  e2e-gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    needs: [e2e-android]
    if: always()
    steps:
      - name: Check E2E result
        run: |
          echo "E2E Android: ${{ needs.e2e-android.result }}"
          if [[ "${{ needs.e2e-android.result }}" == "failure" ]]; then
            echo "❌ E2E smoke tests failed"
            exit 1
          fi
          echo "✅ E2E smoke tests passed"